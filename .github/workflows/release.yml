name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*'

permissions:
  contents: write  # required to create the GitHub Release and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest  # free-tier Linux runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build standalone jar
        run: gradle clean shadowJar -Pversion=${{ steps.version.outputs.value }} --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/libs/dublime-${{ steps.version.outputs.value }}-all.jar
